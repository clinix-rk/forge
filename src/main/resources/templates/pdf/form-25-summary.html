<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Form No. 25 Summary</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 15mm;
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #555;
            }
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 9pt;
            color: #111;
            margin: 0;
            padding: 0;
        }

        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-row-1 {
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-align: center;
        }

        .header-row-2 {
            font-size: 10pt;
            font-weight: normal;
            margin-bottom: 10px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead {
            display: table-header-group;
        }

        tr {
            page-break-inside: avoid;
        }

        th, td {
            border: 0.5px solid #444;
            padding: 6px 8px;
            word-wrap: break-word;
        }

        /* Rule 1: Table headers strictly center-aligned across all columns */
        thead th {
            background-color: #f2f2f2;
            font-weight: bold;
            text-align: center !important;
            font-size: 8.5pt;
            vertical-align: middle;
        }

        /* Rule 2: Default body cell properties (Left-aligned text) */
        td {
            font-size: 8.5pt;
            vertical-align: middle;
            text-align: left;
        }

        .col-text {
            text-align: left;
        }

        /* Rule 3: Date column fix - prevents line wrap and forces center layout */
        .col-date {
            width: 22%;
            text-align: center;
            white-space: nowrap !important;
            word-wrap: normal !important;
        }

        /* Rule 4: Amount columns right-aligned specifically for table body cells */
        td.col-cash,
        td.col-digital,
        td.col-total {
            text-align: right;
        }

        .col-cash {
            width: 26%;
        }

        .col-digital {
            width: 26%;
        }

        .col-total {
            width: 26%;
            font-weight: bold;
        }

        .grand-total-row td {
            background-color: #e6e6e6;
            font-weight: bold;
            font-size: 9pt;
        }
    </style>
</head>
<body>

<div class="header-container">
    <div class="header-row-1">FORM NO 25 SUMMARY</div>
    <div class="header-row-2">
        Date: <span th:text="${startDate}">01-08-2026</span> to <span th:text="${endDate}">16-08-2026</span>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th class="col-date">Date</th>
        <th class="col-cash">Cash Amount</th>
        <th class="col-digital">Cheque / Online Amount</th>
        <th class="col-total">Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="summary : ${summaryEntries}">
        <td class="col-date" th:text="${summary.date}">01-08-2026</td>
        <td class="col-cash"
            th:text="${#numbers.formatDecimal(summary.cashAmount, 1, 'POINT', 2, 'POINT')}">1500.00
        </td>
        <td class="col-digital"
            th:text="${#numbers.formatDecimal(summary.chequeOnlineAmount, 1, 'POINT', 2, 'POINT')}">
            2500.00
        </td>
        <td class="col-total"
            th:text="${#numbers.formatDecimal(summary.totalAmount, 1, 'POINT', 2, 'POINT')}">4000.00
        </td>
    </tr>
    <tr class="grand-total-row">
        <td class="col-date">Grand Total</td>
        <td class="col-cash"
            th:text="${#numbers.formatDecimal(grandTotalCash, 1, 'POINT', 2, 'POINT')}">1500.00
        </td>
        <td class="col-digital"
            th:text="${#numbers.formatDecimal(grandTotalDigital, 1, 'POINT', 2, 'POINT')}">2500.00
        </td>
        <td class="col-total"
            th:text="${#numbers.formatDecimal(grandTotalOverall, 1, 'POINT', 2, 'POINT')}">4000.00
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
