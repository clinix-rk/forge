<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prescription Content</title>
    <style>
        @page {
            size: A4;
            margin-top: 58mm;
            margin-bottom: 72mm;
            margin-left: 20mm;
            margin-right: 20mm;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11.5pt;
            color: #1a1a1a;
            line-height: 1.5;
            background: transparent;
            margin: 0;
            padding: 0;
        }

        /* --- TABLE LAYOUT FOR PATIENT INFO --- */
        .patient-info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            table-layout: auto;
            border: none;
        }

        .patient-info-table td {
            border: none;
            padding: 4px 8px;
            vertical-align: baseline;
        }

        .patient-info-label {
            font-weight: bold;
            color: #555555;
            font-size: 10pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding-right: 8px;
        }

        .patient-info-value {
            color: #1a1a1a;
            font-size: 11.5pt;
        }

        /* --------------------------------------- */

        .rx-symbol {
            font-family: 'NotoSerif', sans-serif;
            font-size: 28pt;
            font-weight: bold;
            color: #000000;
            margin: 15px 0 10px 0;
            line-height: 1;
        }

        .details-block {
            margin-bottom: 30px;
            white-space: pre-wrap;
            font-size: 11.5pt;
            color: #222222;
        }

        .medicines-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            -fs-table-paginate: paginate;
        }

        .medicines-table th {
            border-bottom: 2px solid #1a1a1a;
            font-weight: bold;
            text-align: left;
            padding: 8px 4px;
            font-size: 10.5pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555555;
        }

        .medicines-table thead {
            display: none;
        }

        .medicines-table td {
            padding: 10px 4px;
            border-bottom: 1px solid #eeeeee;
            font-size: 11.5pt;
        }

        .medicines-table tr {
            page-break-inside: avoid;
        }

        .type-col {
            width: 12%;
        }

        .dosage-col {
            width: 25%;
        }

        .instruction-col {
            width: 30%;
        }

        .qty-col {
            text-align: center;
            width: 15%;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

<!-- Patient Info Table -->
<table class="patient-info-table">
    <!-- Row 1: Empty Left, Date Right -->
    <tr>
        <td></td>
        <td>
            <span class="patient-info-label">Date:</span>
            <span class="patient-info-value" th:text="${rx.date}">20/06/2026</span>
        </td>
    </tr>
    <!-- Row 2: Name Left, Age/Gender Right -->
    <tr>
        <td>
            <span class="patient-info-label">Patient Name:</span>
            <span class="patient-info-value" style="font-weight: bold; font-size: 12.5pt;"
                  th:text="${rx.patientName}">John Doe</span>
        </td>
        <td>
            <span class="patient-info-label">Age / Gender:</span>
            <span class="patient-info-value" th:text="${rx.ageGender}">34 yrs / Male</span>
        </td>
    </tr>
    <!-- Row 3: Case No Left, Empty Right -->
    <tr>
        <td>
            <span class="patient-info-label">Case No:</span>
            <span class="patient-info-value" style="font-weight: bold;" th:text="${rx.caseNo}">Y00001</span>
        </td>
        <td></td>
    </tr>
</table>

<div class="rx-symbol">℞</div>

<table class="medicines-table" th:if="${rx.medicines != null and !rx.medicines.isEmpty()}">
    <thead>
    <tr>
        <th>Medicine Name</th>
        <th class="dosage-col">Dosage</th>
        <th class="instruction-col">Instruction</th>
        <th class="qty-col">Qty</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="med : ${rx.medicines}">
        <td style="font-weight: bold; font-size: 12pt;" th:text="${med.medicineName}">Amoxicillin
            500mg
        </td>
        <td class="dosage-col" th:text="${med.dosage}">1-0-1</td>
        <td class="instruction-col" th:text="${med.instruction}">After food</td>
        <td class="qty-col" th:text="${med.quantity}">10</td>
    </tr>
    </tbody>
</table>

<div class="details-block" th:text="${rx.details}">Clinical findings and notes go here...</div>

</body>
</html>
