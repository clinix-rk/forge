<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Prescription Content</title>
    <style>
        @page {
            size: A4;
            margin-top: 40mm;
            margin-bottom: 40mm;
            margin-left: 15mm;
            margin-right: 15mm;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11pt;
            color: #1a1a1a;
            line-height: 1.5;
            background: transparent;
        }

        /* --- HEADER SECTION --- */
        .header-container {
            margin-bottom: 12px;
        }

        .header-line {
            margin-bottom: 5px;
            overflow: hidden;
        }

        .patient-name-line {
            float: left;
            font-size: 11pt;
        }

        .patient-name-line .label {
            font-weight: bold;
            color: #333333;
        }

        .patient-name-line .value {
            font-weight: bold;
            color: #1a1a1a;
        }

        .date-line {
            float: right;
            font-size: 11pt;
        }

        .date-line .label {
            font-weight: bold;
            color: #333333;
        }

        .date-line .value {
            font-weight: normal;
            color: #1a1a1a;
        }

        .age-gender-line {
            clear: both;
            font-size: 11pt;
            margin-bottom: 8px;
        }

        .age-gender-line .label {
            font-weight: bold;
            color: #333333;
        }

        .age-gender-line .value {
            font-weight: normal;
            color: #1a1a1a;
        }

        /* --- RX SYMBOL --- */
        .rx-symbol {
            font-family: 'NotoSerif', sans-serif;
            font-size: 24pt;
            font-weight: bold;
            color: #000000;
            margin: 8px 0 10px 0;
            line-height: 1;
        }

        /* --- INDENTED CONTENT SECTION --- */
        .content-indented {
            margin-left: 25px;
        }

        /* --- MEDICINES SECTION --- */
        .medicines-list {
            margin-bottom: 15px;
        }

        .medicine-item {
            margin-bottom: 12px;
            page-break-inside: avoid;
        }

        .medicine-header {
            margin-bottom: 3px;
            overflow: hidden;
        }

        .medicine-name {
            float: left;
            font-size: 11.5pt;
            font-weight: bold;
            color: #1a1a1a;
        }

        .medicine-quantity {
            float: right;
            font-size: 11pt;
            font-weight: bold;
            color: #1a1a1a;
        }

        .medicine-dosage-detail {
            clear: both;
            margin-left: 15px;
            font-size: 11pt;
            color: #333333;
            line-height: 1.4;
        }

        .dosage-value {
            font-weight: normal;
        }

        .instruction-value {
            font-weight: normal;
        }

        /* --- DETAILS/NOTES SECTION --- */
        .details-block {
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 11pt;
            color: #222222;
            line-height: 1.5;
            word-wrap: break-word;
        }

        /* --- PRINT OPTIMIZATION --- */
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
        }
    </style>
</head>
<body>

<!-- HEADER SECTION -->
<div class="header-container">
    <div class="header-line">
        <div class="patient-name-line">
            <span class="label">Patient:</span>
            <span class="value" th:text="${rx.patientName}">John Doe</span>
        </div>
        <div class="date-line">
            <span class="label">Date:</span>
            <span class="value" th:text="${rx.date}">20/06/2026</span>
        </div>
    </div>

    <div class="age-gender-line">
        <span class="label">Age/Gender:</span>
        <span class="value" th:text="${rx.ageGender}">34 yrs / Male</span>
    </div>
</div>

<!-- RX SYMBOL -->
<div class="rx-symbol">℞</div>

<!-- INDENTED CONTENT -->
<div class="content-indented">

    <!-- MEDICINES LIST -->
    <div class="medicines-list" th:if="${rx.medicines != null and !rx.medicines.isEmpty()}">
        <div class="medicine-item" th:each="med : ${rx.medicines}">
            <div class="medicine-header">
                <span class="medicine-name" th:text="${med.medicineName}">Amoxicillin 500mg</span>
                <span class="medicine-quantity" th:text="${med.quantity}">10</span>
            </div>
            <div class="medicine-dosage-detail">
                <span class="dosage-value" th:text="${med.dosage}">1-0-1</span>
                <span>
                    (<span class="instruction-value" th:text="${med.instruction}">After food</span>)
                </span>
            </div>
        </div>
    </div>

</div>

</body>
</html>
