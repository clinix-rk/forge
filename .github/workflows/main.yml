name: Forge - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Run tests
        run: mvn clean test
      
      - name: Build Docker image (Jib)
        run: mvn jib:build -DskipTests -Djib.to.image=myapp-forge:${{ github.sha }}
permissions:
  packages: write
  contents: read
